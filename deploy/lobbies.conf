# lobbies.conf - each lobby's own settings, for lobbies.sh. A line per lobby: its number, then its server flags.
# Every lobby rotates through the seven tracks, one each race, starting where --track says (--fixed-track stops that).
# A lobby with no line starts on Hilltop Heights with the defaults. Change this, then ./lobbies.sh restart.
#
# Tracks: 0 HILLTOP HEIGHTS  1 BAYSIDE BREAKER  2 SUMMIT SWITCHBACKS  3 MIDNIGHT MILE  4 HARBOUR DEEP
#         5 LAGOON LOOP  6 TWIN ISLES
# Flags:  --track N (start there)  --fixed-track (stay there)  --weather 0-3|random (clear, rain, fog, storm)
#         --laps N  --bots 0-4  --no-showdown (end at the results)  --roam (no race: the island, together)
#         --roam-minutes M (roam: next track every M minutes)  --name "NAME" (instead of THADAV.COM N)
#
# lobby  flags
1  --track 0
2  --track 1 --weather random
3  --track 2
4  --track 3 --weather 2
5  --track 4 --laps 5
6  --track 5 --no-showdown --name "THADAV.COM RACE ONLY"
7  --track 6 --weather 3 --name "THADAV.COM STORM"
8  --roam --roam-minutes 20 --name "THADAV.COM ROAM"
