// Fog City Fury for Android: one APK holding the game for 32- and 64-bit ARM phones and tablets, and x86-64
// (Chromebooks, emulators). Android 5.0 (API 21) or later with OpenGL ES 3.0.
// The native code is built by ndk-build from jni/: SDL2 (fetched by ../setup.sh) and the game (../../src).
apply plugin: 'com.android.application'

android {
    namespace "com.fogcityfury.game"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.fogcityfury.game"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 29
        versionName "2.26"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // No release key is kept in the project: release builds are signed with the debug key so the APK installs
            // as it is. Replace this with your own signingConfig before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
