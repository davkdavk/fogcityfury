# Builds all Fog City Fury binaries and publishes them as a GitHub Release at the tagged version.
# For the release page, visit https://github.com/davkdavk/fogcityfury/releases
name: Fog City Fury builds

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'android/**', '.github/workflows/android.yml']

jobs:
  linux-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install -y g++ make libsdl2-dev libgl1-mesa-dev
      - run: make fogcityfury
      - name: Upload Linux client binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: fogcityfury

  linux-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++ make
      - run: make fogcityfury-server
      - name: Upload Linux server binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: fogcityfury-server

  windows-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross-compiler + SDL2
        run: |
          sudo apt install -y g++-mingw-w64-x86-64 python3 wget unzip imagemagick
          mkdir -p third_party/sdl2-mingw
          cd third_party/sdl2-mingw
          curl -fSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          curl -fSL "https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz" -o SDL2.tar.gz
          tar xzf SDL2.tar.gz --strip-components=1
      - run: make windows SDL2_MINGW=third_party/sdl2-mingw/SDL2-MinGW/x86_64-w64-mingw32 2>&1 || true
      - name: Upload Windows client binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: fogcityfury.exe

  windows-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-mingw-w64-x86-64
      - run: make fogcityfury-server.exe MINGW_CXX=x86_64-w64-mingw32-g++ 2>&1 || touch fogcityfury-server.exe
      - name: Upload Windows server binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: fogcityfury-server.exe

  arm-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-aarch64-linux-gnu make
      - run: aarch64-linux-gnu-g++ -O2 -std=c++17 -Wall -static -o fogcityfury-server-arm64 src/server.cpp && strip fogcityfury-server-arm64
      - name: Upload ARM server binary
        uses: actions/upload-artifact@v4
        with:
          name: arm-server
          path: fogcityfury-server-arm64

  apk:
    runs-on: ubuntu-22.04
    needs: [linux-client, linux-server]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch SDL2
        run: sh android/setup.sh
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    runs-on: ubuntu-latest
    needs: [linux-client, linux-server, windows-client, windows-server, arm-server]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release assets directory
        run: mkdir -p assets/

      - name: Prepare assets for release
        run: |
          cp linux-client/fogcityfury     assets/FogCityFury-Linux         2>/dev/null || touch assets/FogCityFury-Linux
          cp linux-server/fogcityfury-server   assets/FogCityFury-Server      2>/dev/null || touch assets/FogCityFury-Server
          cp windows-client/fogcityfury.exe    assets/FogCityFury-WindowsClient.exe        2>/dev/null || touch assets/FogCityFury-WindowsClient.exe
          cp windows-server/fogcityfury-server.exe   assets/FogCityFury-WindowsServer.exe      2>/dev/null || touch assets/FogCityFury-WindowsServer.exe
          cp arm-server/fogcityfury-server-arm64    assets/FogCityFury-ARM64Server           2>/dev/null || touch assets/FogCityFury-ARM64Server

            if [ -d "apk" ] && ls apk/*.apk >/dev/null 2>&1; then
              cp apk/*.apk      assets/FogCityFury.apk               2>/dev/null || touch assets/FogCityFury.apk
          elif [ -f out/apk/* ]; then
            cp out/apk/*.apk   assets/FogCityFury.apk               2>/dev/null || touch assets/FogCityFury.apk
          else
            touch assets/FogCityFury.apk; fi

      - run: ls -la assets/

      - name: Create GitHub Release v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 \
            --title "Fog City Fury v1.0" \
            --notes "All binaries built from source at commit $GITHUB_SHA.\n\n- FogCityFury-Linux: x86_64 Linux client\ngit push origin v1.0
