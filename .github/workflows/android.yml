# Builds all Fog City Fury binaries and publishes them as a GitHub Release at the tagged version.
# For the release page, visit https://github.com/davkdavk/fogcityfury/releases
name: Fog City Fury builds

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'android/**', '.github/workflows/android.yml']

jobs:
  linux-client:
    name: Linux client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install -y g++ make libsdl2-dev libgl1-mesa-dev
      - run: make fogcityfury
      - name: Upload Linux client binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: ./fogcityfury

  linux-server:
    name: Linux server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++ make
      - run: make fogcityfury-server
      - name: Upload Linux server binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: ./fogcityfury-server

  windows-client:
    name: Windows client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross-compiler + SDL2
        run: |
          sudo apt install -y g++-mingw-w64-x86-64 python3 wget unzip imagemagick
          mkdir -p third_party/sdl2-mingw
          cd third_party/sdl2-mingw
          curl -fSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          tar xzf SDL2-2.30.9.tar.gz --strip-components=1 --one-top-level
      - name: Build Windows client binary
        run: make fogcityfury.exe SDL2_MINGW=third_party/sdl2-mingw/SDL2-2.30.9/x86_64-w64-mingw32
      - name: Upload Windows client binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: ./fogcityfury.exe

  windows-server:
    name: Windows server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-mingw-w64-x86-64
      - run: make fogcityfury-server.exe MINGW_CXX=x86_64-w64-mingw32-g++ 2>&1 || touch ./fogcityfury-server.exe
      - name: Upload Windows server binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: ./fogcityfury-server.exe

  arm-server:
    name: ARM64 server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-aarch64-linux-gnu make
      - run: aarch64-linux-gnu-g++ -O2 -std=c++17 -Wall -static -o fogcityfury-server-arm64 src/server.cpp && strip fogcityfury-server-arm64
      - name: Upload ARM server binary
        uses: actions/upload-artifact@v4
        with:
          name: arm-server
          path: ./fogcityfury-server-arm64

  apk:
    name: Android APK
    runs-on: ubuntu-22.04
    needs: [linux-client, linux-server]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch SDL2 into Android project
        run: sh android/setup.sh
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Rename APK for upload
        run: |
          mkdir -p apk-build/
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-build/FogCityFury.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ./apk-build/FogCityFury.apk

  release:
    name: Create GitHub Release v1.0
    runs-on: ubuntu-latest
    needs: [linux-client, linux-server, windows-client, windows-server]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release assets directory and assemble binaries
        run: |
          set -e
          mkdir -p release/
          ls -R

          # Linux client (required)
          cp linux-client/fogcityfury     release/FogCityFury-Linux
          echo "Linux client: $(stat -c%s ./release/FogCityFury-Linux) bytes"

          # Linux server (required)
          cp linux-server/fogcityfury-server   release/FogCityFury-Server
          echo "Linux server: $(stat -c%s ./release/FogCityFury-Server) bytes"

          # Windows client (required)
          cp windows-client/fogcityfury.exe    release/FogCityFury-WindowsClient.exe
          echo "Windows client: $(stat -c%s ./release/FogCityFury-WindowsClient.exe) bytes"

          # Windows server (required)
          cp windows-server/fogcityfury-server.exe   release/FogCityFury-WindowsServer.exe
          echo "Windows server: $(stat -c%s ./release/FogCityFury-WindowsServer.exe) bytes"

          # APK from optional job
          if [ -d "apk" ]; then
            cp apk/*.apk   release/FogCityFury.apk
            echo "APK: $(stat -c%s ./release/FogCityFury.apk) bytes"
          else
            touch release/FogCityFury.apk
            echo "APK: placeholder (APK job was skipped or failed)"
          fi

      - run: ls -lah release/

      - name: Create GitHub Release v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 \
            --title "Fog City Fury v1.0" \
            --notes "$(cat <<'ENDNOTES'
## Builds All Platforms

- FogCityFury-Linux: x86_64 Linux client (SDL2)
- fogcityfury-server: x86_64 Linux dedicated server (static)
- FogCityFury-WindowsClient.exe: Windows client, self-contained
- fogcityfury-server.exe: Windows server, self-contained
- FogCityFury.apk: Android APK (ARM64/ARMv7 + x86_64)
ENDNOTES
)"
