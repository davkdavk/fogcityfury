# Builds Fog City Fury for every platform and publishes them as a GitHub Release.
# Release page: https://github.com/davkdavk/fogcityfury/releases
name: Fog City Fury builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Linux client + server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libsdl2-dev libgl1-mesa-dev
      - run: make fogcityfury fogcityfury-server
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            fogcityfury
            fogcityfury-server

  windows:
    name: Windows client + server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Fetch SDL2 development libraries for MinGW
        run: |
          mkdir -p third_party
          curl -fSL -o third_party/sdl2-mingw.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz
          tar xzf third_party/sdl2-mingw.tar.gz -C third_party
      - name: Cross-compile
        run: make windows SDL2_MINGW="$PWD/third_party/SDL2-2.30.9/x86_64-w64-mingw32"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            fogcityfury.exe
            fogcityfury-server.exe

  arm64-server:
    name: ARM64 server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
      - run: make fogcityfury-server-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-server
          path: fogcityfury-server-arm64

  apk:
    name: Android APK
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch SDL2 into the Android project
        run: sh android/setup.sh
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release
    runs-on: ubuntu-22.04
    needs: [linux, windows, arm64-server]
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.arm64-server.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release files
        run: |
          set -e
          mkdir -p release
          cp artifacts/linux/fogcityfury              release/FogCityFury-Linux
          cp artifacts/linux/fogcityfury-server       release/FogCityFury-Server-Linux
          cp artifacts/windows/fogcityfury.exe        release/FogCityFury-Windows.exe
          cp artifacts/windows/fogcityfury-server.exe release/FogCityFury-Server-Windows.exe
          cp artifacts/arm64-server/fogcityfury-server-arm64 release/FogCityFury-Server-ARM64
          if [ -f artifacts/apk/app-debug.apk ]; then cp artifacts/apk/app-debug.apk release/FogCityFury.apk; fi
          ls -la release/
      - name: Create or update release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Fog City Fury v1.0, built from ${GITHUB_SHA}."
          gh release view v1.0 >/dev/null 2>&1 \
            && gh release upload v1.0 release/* --clobber \
            || gh release create v1.0 release/* --title "Fog City Fury v1.0" --notes "$NOTES"
