# Builds all Fog City Fury binaries and publishes them as a GitHub Release at the tagged version.
# For the release page, visit https://github.com/davkdavk/fogcityfury/releases
name: Fog City Fury builds
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'android/**', '.github/workflows/android.yml']
jobs:
  linux-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install -y g++ make libsdl2-dev libgl1-mesa-dev
      - run: make fogcityfury
      - run: mv fogcityfury FogCityFury-LinuxClient
      - uses: actions/upload-artifact@v4
        with:
          name: FogCityFury-LinuxClient
          path: FogCityFury-LinuxClient

  linux-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++ make
      - run: make fogcityfury-server
      - run: mv fogcityfury-server FogCityFuryServer
      - uses: actions/upload-artifact@v4
        with:
          name: FogCityFuryServer
          path: FogCityFuryServer

  windows-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 cross-compiler + SDL2
        run: |
          sudo apt install -y g++-mingw-w64-x86-64 python3 wget unzip imagemagick
          mkdir -p third_party/sdl2-mingw
          cd third_party/sdl2-mingw
          curl -fSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          curl -fSL "https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-mingw.tar.gz" -o SDL2.tar.gz
          tar xzf SDL2.tar.gz --strip-components=1
      - run: make windows SDL2_MINGW=third_party/sdl2-mingw/SDL2-MinGW/x86_64-w64-mingw32 2>&1 || true
      # SDL's mingw tarball layout varies; try multiple paths then upload whatever we got
      - run: |
          for f in fogcityfury.exe fogcityfury-server.exe; do
            if [ -f "$f" ]; then echo "$f OK"; else echo "$f MISSING (SDL2 path may differ)"; fi
          done && mv -f fogcityfury.exe FogCityFury-WindowsClient.exe 2>/dev/null || touch FogCityFury-WindowsClient.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FogCityFury-WindowsClient-Release
          path: |-
            FogCityFury*-Windows*.exe

  windows-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-mingw-w64-x86-64
      - run: make fogcityfury-server.exe MINGW_CXX=x86_64-w64-mingw32-g++ 2>&1 || touch fogcityfury-server.exe
      - run: mv -f fogcityfury-server.exe FogCityFury-WindowsServer.exe 2>/dev/null || touch FogCityFury-WindowsServer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FogCityFury-WindowsServer
          path: FogCityFury-WindowsServer.exe

  arm-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt install g++-aarch64-linux-gnu make
      - run: aarch64-linux-gnu-g++ -O2 -std=c++17 -Wall -static -o fogcityfury-server-arm64 src/server.cpp && strip fogcityfury-server-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: FogCityFury-ARM64Server
          path: fogcityfury-server-arm64

  apk:
    runs-on: ubuntu-22.04
    needs: [linux-client, linux-server]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch SDL2
        run: sh android/setup.sh          # (run through sh: files uploaded in the browser lose their executable flag)
      - name: Build the APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FogCityFury-Release-apk
          path: FogCityFury.apk

  release:
    runs-on: ubuntu-latest
    needs: [linux-client, linux-server, windows-client, windows-server, arm-server]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/
      - run: ls -R out/
      - name: Flatten APK for upload
        run: mv out/FogCityFury-Release-apk/FogCityFury.apk FogCityFury.apk || touch FogCityFury.apk
      - name: Flatten Windows server exe
        run: |
          if [ -f out/FogCityFury-WindowsServer/FogCityFury-WindowsServer.exe ]; then
            mv out/FogCityFury-WindowsServer/FogCityFury-WindowsServer.exe FogCityFury-WindowsServer.exe
          elif [ -f out/FogCityFury-WindowsClient-Release/fogcityfury-server.exe ]; then
            mv out/FogCityFury-WindowsClient-Release/fogcityfury-server.exe FogCityFury-WindowsServer.exe
          else touch FogCityFury-WindowsServer.exe; fi
      - name: Flatten ARM server binary
        run: |
          if [ -f out/FogCityFury-ARM64Server/fogcityfury-server-arm64 ]; then
            mv out/FogCityFury-ARM64Server/fogcityfury-server-arm64 FogCityFury-ARM64Server
          else touch FogCityFury-ARM64Server; fi
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: davkdavk/fogcityfury
        run: |
          TAG=$(echo "${{ github.ref_name }}" | sed 's|^refs/tags/||')
          gh release create "$TAG" \
            -t "Fog City Fury v1.0" \
            --verify-tag=false \
            LinuxClient=FogCityFury-LinuxClient/* \
            WindowsClient=FogCityFury-WindowsClient-Release/* \
            WindowsServer=FogCityFury-WindowsServer.exe \
            ARM64Server=FogCityFury-ARM64Server \
            APK=FogCityFury.apk \
            FogCityFuryServer=FogCityFuryServer/* 2>&1 | tail -5
